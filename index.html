<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>搞钱天赋测试 — 你的性格适合靠什么赚钱？</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --primary: #6366f1; /* 活力紫色 */
      --secondary: #a5b4fc;
      --bg: #f8fafc; /* 浅灰色背景 */
      --card-bg: #ffffff;
      --text: #1e293b;
      --accent: #f43f5e; /* 点缀红 */
    }
    body { 
      background: var(--bg); 
      color: var(--text); 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.6;
      margin: 0;
    }
    .wrap { max-width: 500px; margin: 0 auto; padding: 20px; }
    .card { 
      background: var(--card-bg); 
      border-radius: 24px; 
      padding: 24px; 
      box-shadow: 0 10px 25px rgba(0,0,0,0.05); 
    }
    header { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; }
    header h1 { font-size: 22px; margin: 0; color: var(--primary); }
    
    .intro { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; gap: 10px; }
    .small { font-size: 12px; color: #64748b; }
    
    .opt { 
      background: #f1f5f9; 
      border: 2px solid transparent; 
      border-radius: 16px; 
      padding: 16px; 
      margin-bottom: 12px;
      transition: all 0.2s ease;
      font-size: 16px;
      text-align: left;
      width: 100%;
      color: var(--text);
      cursor: pointer;
    }
    .opt:active { transform: scale(0.98); }
    .opt.active { 
      background: #eef2ff; 
      border-color: var(--primary); 
      color: var(--primary); 
      font-weight: bold;
    }
    
    .actions { display: flex; gap: 10px; margin-top: 20px; }
    button { border: none; cursor: pointer; font-weight: 600; }
    button#next, button#submit {
      flex: 2;
      background: var(--primary);
      color: white;
      padding: 16px;
      border-radius: 16px;
      font-size: 18px;
    }
    button#prev {
      flex: 1;
      background: #e2e8f0;
      color: #475569;
      padding: 16px;
      border-radius: 16px;
    }

    .progress { height: 8px; border-radius: 4px; background: #e2e8f0; margin: 10px 0; overflow: hidden; }
    .progress i { display: block; height: 100%; background: var(--primary); transition: width 0.3s ease; width: 0%; }

    /* 结果页样式 */
    .result h2 { text-align: center; color: var(--primary); margin-bottom: 10px; }
    .chart-container { margin: 20px 0; position: relative; height: 300px; width: 100%; }
    .bars { margin-top: 20px; }
    .bar { margin-bottom: 12px; }
    .bar .label { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 4px; }
    .bar .meter { height: 6px; background: #f1f5f9; border-radius: 3px; overflow: hidden; }
    .bar .meter i { display: block; height: 100%; background: var(--secondary); }
    
    .share-area { display: flex; gap: 10px; }
    .copybtn { flex: 1; padding: 12px; border-radius: 12px; background: #f1f5f9; font-size: 14px; margin-top: 15px; }
    
    footer { text-align: center; margin-top: 30px; opacity: 0.6; padding-bottom: 40px; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div style="width:48px;height:48px;border-radius:12px;background:linear-gradient(135deg,#6366f1,#a5b4fc);display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:20px">$</div>
      <div>
        <h1>搞钱天赋测试</h1>
        <p class="small">探索你的性格更适合哪种搞钱方式</p>
      </div>
    </header>

    <div class="card">
      <div id="quiz-ui">
        <div class="intro">
          <div style="flex:1">
            <div class="progress" aria-hidden="true"><i id="prog"></i></div>
            <div class="small" id="qcount">已答 0 / 8</div>
          </div>
          <div style="text-align:right">
            <div class="small">预计时长</div>
            <strong>2 分钟</strong>
          </div>
        </div>

        <div class="questions" id="questions"></div>

        <div class="actions">
          <button id="prev" style="display:none">上一步</button>
          <button id="next">下一题</button>
          <button id="submit" style="display:none">查看我的天赋结果</button>
        </div>
      </div>

      <div id="resultArea" style="display:none" class="result"></div>
    </div>

    <footer>
      <div class="small">仅供性格参考 · 非专业财务建议</div>
      <div class="small">Version 1.1 · Powered by Gemini</div>
    </footer>
  </div>

  <script>
    const qa = [
      { q: "遇到新机会你更倾向于？", opts: [
          {t: "立刻尝试，哪怕有风险", v:[2,0,0,1,0]},
          {t: "先凭创意做一个小试验", v:[1,2,0,0,0]},
          {t: "评估数据和可行性再行动", v:[0,0,2,0,0]},
          {t: "先跟朋友/人脉沟通测反馈", v:[0,0,0,2,0]},
          {t: "投入到能产生被动收益的工具", v:[0,0,0,0,2]}
      ]},
      { q: "你的工作节奏更偏好什么？", opts: [
          {t:"高强度、目标导向", v:[2,0,0,1,0]},
          {t:"自由安排、做自己喜欢的事", v:[0,2,0,0,0]},
          {t:"稳定、有体系性地深耕技能", v:[0,0,2,0,0]},
          {t:"社交频繁、靠人脉推动结果", v:[1,0,0,2,0]},
          {t:"构建可复利的资产与系统", v:[0,0,0,0,2]}
      ]},
      { q: "如果要赚钱，你最不想做的是？", opts: [
          {t:"没有掌控权，被人指挥", v:[2,0,0,0,0]},
          {t:"天天重复没有创造性的活", v:[0,2,0,0,0]},
          {t:"面对不断变化的无逻辑问题", v:[0,0,2,0,0]},
          {t:"孤军作战，不与人打交道", v:[0,0,0,2,0]},
          {t:"把所有钱都放着不动或赌运气", v:[0,0,0,0,2]}
      ]},
      { q: "你解决问题时常用的方法是？", opts: [
          {t:"快速迭代并从错误中学习", v:[2,0,0,1,0]},
          {t:"用创意或新颖方式突破", v:[0,2,0,0,0]},
          {t:"用技术或结构化流程解决", v:[0,0,2,0,0]},
          {t:"动用人脉与谈判达成", v:[0,0,0,2,0]},
          {t:"设计长期收益模型并部署资金", v:[0,0,0,0,2]}
      ]},
      { q: "当你赚到一笔钱，你通常怎么处理？", opts: [
          {t:"投入到下一个项目扩大规模", v:[2,0,0,0,0]},
          {t:"买灵感工具或体验提升创意", v:[0,2,0,0,0]},
          {t:"投在自我提升或设备提高产出", v:[0,0,2,0,0]},
          {t:"拓展人脉或做公关", v:[0,0,0,2,0]},
          {t:"配置到长期资产或被动收益", v:[0,0,0,0,2]}
      ]},
      { q: "你认为好的赚钱方式应该具备？", opts: [
          {t:"可以快速放大，规模效应强", v:[2,0,0,0,0]},
          {t:"能表达个性并带来自由感", v:[0,2,0,0,0]},
          {t:"门槛高但稳定可信赖", v:[0,0,2,0,0]},
          {t:"人际网络能显著提升结果", v:[0,0,0,2,0]},
          {t:"长期复利、少动维护", v:[0,0,0,0,2]}
      ]},
      { q: "面对失败你通常会？", opts: [
          {t:"迅速调整策略再出发", v:[2,0,0,0,0]},
          {t:"把失败变成创作素材或经验", v:[0,2,0,0,0]},
          {t:"分析原因、优化技术与流程", v:[0,0,2,0,0]},
          {t:"寻求外部支持和合作者", v:[0,0,0,2,0]},
          {t:"用更稳妥的工具减少未来风险", v:[0,0,0,0,2]}
      ]},
      { q: "你理想中的收入来源是？", opts: [
          {t:"自己创业，收入随规模上升", v:[2,0,0,0,0]},
          {t:"靠才华与作品持续变现", v:[0,2,0,0,0]},
          {t:"因技能被高薪聘用或承接项目", v:[0,0,2,0,0]},
          {t:"靠人脉资源不断获得机会", v:[0,0,0,2,0]},
          {t:"资产在后台稳步产生现金流", v:[0,0,0,0,2]}
      ]}
    ];

    const categories = [
      {id:'entre', name:'创业家'},
      {id:'crea', name:'自由创意'},
      {id:'tech', name:'技术专才'},
      {id:'sales', name:'销售交际'},
      {id:'invest', name:'投资/被动'}
    ];

    let answers = new Array(qa.length).fill(null);
    let current = 0;
    let radarChart = null;

    function renderQuestions(){
      const questionsEl = document.getElementById('questions');
      questionsEl.innerHTML = '';
      qa.forEach((item, idx) => {
        const div = document.createElement('div');
        div.className = 'q';
        div.style.display = idx===current ? 'block' : 'none';
        div.innerHTML = `<h3 style="margin-bottom:20px">${idx+1}. ${item.q}</h3>`;
        const optsDiv = document.createElement('div');
        item.opts.forEach((op, oi) => {
          const b = document.createElement('button');
          b.className = `opt ${answers[idx] === oi ? 'active' : ''}`;
          b.textContent = op.t;
          b.onclick = () => selectOption(idx, oi);
          optsDiv.appendChild(b);
        });
        div.appendChild(optsDiv);
        questionsEl.appendChild(div);
      });
      updateUI();
    }

    function selectOption(qidx, optidx){
      answers[qidx] = optidx;
      if (current < qa.length - 1) {
        current++;
        renderQuestions();
      } else {
        updateUI();
      }
    }

    function updateUI(){
      const done = answers.filter(a => a !== null).length;
      document.getElementById('prog').style.width = (done / qa.length * 100) + '%';
      document.getElementById('qcount').textContent = `已答 ${done} / ${qa.length}`;
      document.getElementById('prev').style.display = current > 0 ? 'block' : 'none';
      document.getElementById('next').style.display = (current < qa.length - 1) ? 'block' : 'none';
      document.getElementById('submit').style.display = done === qa.length ? 'block' : 'none';
    }

    document.getElementById('prev').onclick = () => { if(current>0) {current--; renderQuestions();} };
    document.getElementById('next').onclick = () => { if(current<qa.length-1) {current++; renderQuestions();} };
    document.getElementById('submit').onclick = showResult;

    function showResult(){
      const totals = [0,0,0,0,0];
      qa.forEach((item, qi) => {
        const sel = answers[qi];
        if(sel !== null) item.opts[sel].v.forEach((val, i) => totals[i] += val);
      });

      const max = Math.max(...totals);
      const topIdxs = totals.map((t, i) => t === max ? i : -1).filter(i => i !== -1);
      
      document.getElementById('quiz-ui').style.display = 'none';
      const resArea = document.getElementById('resultArea');
      resArea.style.display = 'block';

      resArea.innerHTML = `
        <h2>${categories[topIdxs[0]].name}型天赋</h2>
        <p class="small" style="text-align:center">${getInterpretation(topIdxs)}</p>
        <div class="chart-container"><canvas id="radarCanvas"></canvas></div>
        <div class="bars">${categories.map((c, i) => `
          <div class="bar">
            <div class="label"><span>${c.name}</span><span>${totals[i]}</span></div>
            <div class="meter"><i style="width:${(totals[i]/max*100)}%"></i></div>
          </div>
        `).join('')}</div>
        <div style="margin-top:20px; font-size:14px;">${getSuggestions(topIdxs[0])}</div>
        <div class="share-area">
          <button class="copybtn" onclick="location.reload()">重新测试</button>
          <button class="copybtn" style="background:var(--primary);color:white" onclick="copyResult()">复制结果</button>
        </div>
      `;

      renderRadar(totals);
    }

    function renderRadar(dataValues) {
      const ctx = document.getElementById('radarCanvas').getContext('2d');
      if (radarChart) radarChart.destroy();
      radarChart = new Chart(ctx, {
        type: 'radar',
        data: {
          labels: categories.map(c => c.name),
          datasets: [{
            data: dataValues,
            backgroundColor: 'rgba(99, 102, 241, 0.2)',
            borderColor: '#6366f1',
            pointBackgroundColor: '#6366f1',
            borderWidth: 2
          }]
        },
        options: {
          scales: { r: { min: 0, ticks: { display: false } } },
          plugins: { legend: { display: false } }
        }
      });
    }

    function getInterpretation(topIdxs){
      if(topIdxs.length > 1) return "你是个复合型人才，在多个领域都有搞钱潜力！";
      const desc = [
        "天生的破局者，擅长在不确定中寻找规模化机会。",
        "靠才华和审美吃饭，自由是你最大的生产力。",
        "硬核实力派，深耕领域是你的聚宝盆。",
        "人脉就是你的钱包，沟通是你最强的杠杆。",
        "不仅会赚钱，更懂如何让钱生钱，追求系统化躺赚。"
      ];
      return desc[topIdxs[0]];
    }

    function getSuggestions(idx){
      const sugs = [
        "<strong>建议：</strong>寻找可规模化的痛点，从小规模MVP开始测试。",
        "<strong>建议：</strong>开始经营个人IP，建立属于你的作品集库。",
        "<strong>建议：</strong>锁定高价值技能，尝试通过顾问或私活实现技能溢价。",
        "<strong>建议：</strong>梳理人脉资产，寻找信息差带来的撮合机会。",
        "<strong>建议：</strong>学习资产配置，尽早开启你的复利计划。"
      ];
      return sugs[idx];
    }

    function copyResult() {
      const text = "我在搞钱天赋测试中测出了“" + document.querySelector('h2').innerText + "”，快来看看你的！";
      navigator.clipboard.writeText(text).then(() => alert("结果已复制，快去分享吧！"));
    }

    renderQuestions();
  </script>
</body>
</html>
